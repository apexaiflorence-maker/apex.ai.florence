<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX AI Florence</title>
<style>body{font-family:system-ui,Arial;background:#f4f6f9;color:#19283a;margin:0}header{background:#122a45;color:white;padding:30px 20px;text-align:center}main{max-width:760px;margin:30px auto;padding:20px}.panel{background:white;border-radius:14px;padding:22px;box-shadow:0 3px 14px #0001}button,select,input,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd2dc}button{background:#174b79;color:white;cursor:pointer}#chat{min-height:130px;white-space:pre-wrap;line-height:1.6}form{display:grid;gap:10px;margin-top:20px}small{color:#667}</style></head>
<body><header><h1>APEX AI Florence</h1><p>Visitor & Student Assistance — Interactive Demo</p></header>
<main><div class="panel"><label for="lang">Language / Lingua / اللغة</label> <select id="lang"><option value="en">English</option><option value="it">Italiano</option><option value="ar">العربية</option></select>
<h2 id="heading">How can we help?</h2><div id="chat" aria-live="polite"></div>
<div id="buttons"></div><hr><h3 id="contactTitle">Contact request (demo only)</h3>
<form id="form"><input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required><textarea id="message" placeholder="Your request" required></textarea><button type="submit" id="send">Preview request</button></form><p id="status"></p><small id="notice">Demo only: no information is sent or stored. No real bookings are made.</small></div></main>
<script>
const content={
en:{heading:"How can we help?",intro:"Welcome! Choose a topic below. This demo uses prepared answers, not live AI.",topics:[["Arrival","For airport transfers, compare tram and licensed taxis. Confirm current routes before travel."],["Accommodation","Ask your host for check-in instructions, access codes and local requirements."],["Students","Contact your school for enrollment, housing and orientation details."],["Explore Florence","Explore museums, historic streets and local experiences. Verify hours and tickets on official sites."]],contact:"Contact request (demo only)",send:"Preview request",notice:"Demo only: no information is sent or stored. No real bookings are made.",status:"Request preview only. No message has been sent."},
it:{heading:"Come possiamo aiutarti?",intro:"Benvenuto! Scegli un argomento. Questa demo usa risposte predefinite, non un'AI collegata.",topics:[["Arrivo","Per raggiungere il centro dall'aeroporto, confronta tramvia e taxi autorizzati. Verifica gli orari aggiornati."],["Alloggio","Chiedi alla struttura istruzioni di check-in, accesso e requisiti locali."],["Studenti","Contatta la tua scuola per iscrizioni, alloggio e orientamento."],["Visitare Firenze","Scopri musei, vie storiche ed esperienze locali. Controlla orari e biglietti sui siti ufficiali."]],contact:"Richiesta di contatto (solo demo)",send:"Anteprima richiesta",notice:"Solo demo: nessun dato viene inviato o salvato. Nessuna prenotazione reale.",status:"Solo anteprima. Nessun messaggio è stato inviato."},
ar:{heading:"كيف يمكننا مساعدتك؟",intro:"أهلاً بك! اختر موضوعاً. هذا نموذج بإجابات جاهزة وليس ذكاءً اصطناعياً متصلاً.",topics:[["الوصول","قارن بين الترام وسيارات الأجرة المرخصة للوصول من المطار، وتحقق من المواعيد الحالية."],["السكن","اطلب من المضيف تعليمات الدخول ورموز الوصول والمتطلبات المحلية."],["الطلاب","تواصل مع مؤسستك التعليمية لمعرفة التسجيل والسكن والتوجيه."],["زيارة فلورنسا","استكشف المتاحف والشوارع التاريخية والأنشطة، وتحقق من المواعيد والتذاكر من المواقع الرسمية."]],contact:"طلب تواصل (تجربة فقط)",send:"معاينة الطلب",notice:"نسخة تجريبية: لا تُرسل أو تُحفظ بيانات، ولا تُجرى حجوزات حقيقية.",status:"معاينة فقط، لم تُرسل أي رسالة."]}};
const lang=document.getElementById("lang"),chat=document.getElementById("chat"),buttons=document.getElementById("buttons");
function render(){let c=content[lang.value];document.documentElement.dir=lang.value==="ar"?"rtl":"ltr";document.getElementById("heading").textContent=c.heading;chat.textContent=c.intro;buttons.replaceChildren();c.topics.forEach(([label,answer])=>{let b=document.createElement("button");b.textContent=label;b.style.margin="4px";b.onclick=()=>chat.textContent=answer;buttons.appendChild(b)});document.getElementById("contactTitle").textContent=c.contact;document.getElementById("send").textContent=c.send;document.getElementById("notice").textContent=c.notice;document.getElementById("status").textContent=""}
lang.onchange=render;document.getElementById("form").onsubmit=e=>{e.preventDefault();document.getElementById("status").textContent=content[lang.value].status};render();
</script></body></html>
